# docker compose up            -> api + mongo
# docker compose --profile mock up  -> also starts the mock Agents Console, so
#                                      the full call loop runs with no Gnani
#                                      account and no credits.
#
# Secrets come from .env (git-ignored); nothing sensitive is defined here.

# Names the Compose project, so everything groups under one heading in Docker
# Desktop instead of being derived from the directory name.
name: emi-voice-agent

services:
  mongo:
    image: mongo:7
    container_name: emi-voice-agent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The API waits on this, so it never starts against a cold database.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    image: emi-voice-agent/api:1.0.0
    container_name: emi-voice-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Container-internal hostnames override whatever .env holds for local runs.
      MONGO_URI: mongodb://mongo:27017
      # Same trap as GNANI_BASE_URL below: env_file loads .env into the
      # container, and ${STORAGE_BACKEND} would substitute from .env too -- so a
      # local .env set to "json" would silently override the compose default and
      # the container would run on the file backend while Mongo sat idle.
      # A distinct variable name keeps the two environments independent.
      STORAGE_BACKEND: ${STORAGE_BACKEND_DOCKER:-mongo}
      # Deliberately a *different* variable name from GNANI_BASE_URL. .env holds
      # the host-side value (127.0.0.1) for running uvicorn directly, and inside
      # a container that address points at the container itself -- so reusing the
      # name here would silently make the API dial itself.
      # To hit the real platform: GNANI_BASE_URL_DOCKER=https://api.inya.ai
      GNANI_BASE_URL: ${GNANI_BASE_URL_DOCKER:-http://mock-gnani:9100}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Only used by the JSON fallback backend.
      - api-data:/app/data

  mock-gnani:
    profiles: ["mock"]
    build: .
    image: emi-voice-agent/mock-console:1.0.0
    container_name: emi-voice-agent-mock-console
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      APP_BASE_URL: http://api:8000
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY}
      MOCK_CALL_SECONDS: ${MOCK_CALL_SECONDS:-3}
    command:
      ["uvicorn", "tests.mock_gnani.main:app", "--host", "0.0.0.0", "--port", "9100"]
    depends_on:
      - api

volumes:
  mongo-data:
  api-data:
